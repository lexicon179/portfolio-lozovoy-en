<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG card</title>
    <style>
      /* Шрифты берём из public/fonts по относительному пути:
         скрипт открывает этот файл как file://, поэтому путь идёт вверх. */
      @font-face {
        font-family: 'Onest';
        font-weight: 700;
        font-display: block;
        src: url(../public/fonts/onest-latin.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Onest';
        font-weight: 800;
        font-display: block;
        src: url(../public/fonts/onest-latin.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Manrope';
        font-weight: 400;
        font-display: block;
        src: url(../public/fonts/manrope-latin.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Manrope';
        font-weight: 600;
        font-display: block;
        src: url(../public/fonts/manrope-latin.woff2) format('woff2');
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }


      /* Как hero на Framer: тёмная поверхность */
      body {
        width: 1200px;
        height: 630px;
        background: #111111;
        color: #f7f7f5;
        font-family: 'Manrope', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 1200px;
        height: 630px;
        padding: 68px 76px 62px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* Шапка: та же метка, что в навигации сайта */
      .top {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: 'Onest', sans-serif;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: -0.01em;
      }
      .mark {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #f7f7f5;
      }

      h1 {
        font-family: 'Onest', sans-serif;
        font-weight: 700;
        font-size: 88px;
        line-height: 1.04;
        letter-spacing: -0.035em;
      }

      .sub {
        margin-top: 26px;
        font-size: 29px;
        line-height: 1.35;
        color: #8c8c84;
      }

      .stats {
        display: flex;
        gap: 64px;
        padding-top: 30px;
        border-top: 1px solid rgba(247, 247, 245, 0.14);
      }
      .stat b {
        display: block;
        font-family: 'Onest', sans-serif;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: -0.02em;
      }
      .stat span {
        display: block;
        margin-top: 10px;
        font-family: 'Manrope', sans-serif;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8c8c84;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">Mike Lozovoy</div>

      <div>
        <h1>Growth that doesn’t burn budget</h1>
        <p class="sub">AI-native growth marketer. I own the result.</p>
      </div>

      <div class="stats">
        <div class="stat"><b>$120K</b><span>raised</span></div>
        <div class="stat"><b>1.2M+</b><span>impressions</span></div>
        <div class="stat"><b>15K</b><span>DAU</span></div>
        <div class="stat"><b>100K</b><span>whitelist</span></div>
        <div class="stat"><b>tier-1</b><span>brands</span></div>
      </div>
    </div>
  </body>
</html>
